# TEMPORARY — r20's windows verdict probe. DELETE BEFORE MERGE.
#
# Why this exists. wolf-interp#121: `test (windows-latest)` in ci.yml now
# exceeds GitHub's hard 6 h job cap and is CANCELLED mid-`test`, so every
# head carrying is50's and is51's corpus growth has NO windows coverage at
# all. is51 merged on that exception and it was approved — a feature branch
# into a trunk that already lacked the coverage restores nothing by waiting.
# A RELEASE is different: r20 tags v0.1.37 and publishes a windows archive,
# and "we never ran the tests on that platform" is not something a release
# should have to say afterwards. So this runs ONCE, to get a verdict.
#
# This is NOT the fix. Sharding ci.yml properly is is52's work (#121) and
# needs design — a stable key chosen so a failure names the same shard on a
# re-run, and a split that stays balanced as the corpus grows. This file is
# the quickest split that fits, kept only long enough to answer one question.
#
# The split, and why it is these three. Measured from the green macOS job of
# run 35170259143 (the same head, `cargo test` = 15,564 s total). Eight
# targets account for 15,540 s of that; the other forty are under 8 s each:
#
#     run_corpus        5038 s      cli              2117 s
#     fault_snapshots   2593 s      region_machine   1170 s
#     explore_corpus    2515 s      rule_registry    1017 s
#                                   divergence        854 s
#                                   fuzz_smoke        236 s
#
# so the balanced three-way split is run_corpus alone (5038 s), the next two
# together (5108 s), and the complement (5418 s) — within 8 % of each other.
# The key is the test TARGET NAME, which is stable: shard 3 is defined as the
# complement of the two named lists, so adding a test file lands it in shard 3
# deterministically rather than renumbering anything.
#
# Windows ran >= 6 h where macOS ran 4.32 h, so windows is at least 1.39x.
# At that ratio each shard is ~1.9 h; at 2.5x it is ~3.5 h. `timeout-minutes`
# is 330 so a shard that misbehaves FAILS by name at 5.5 h instead of being
# silently cancelled at the 6 h ceiling the way #121's job is — the whole
# point here is to get a verdict, and a silent cancel is not one.

name: windows shard probe (TEMPORARY, r20)

on:
  pull_request:
  workflow_dispatch:

jobs:
  shard:
    name: windows shard ${{ matrix.shard }} of 3
    runs-on: windows-latest
    timeout-minutes: 330
    strategy:
      # Every shard reports. One red must not hide the other two, because a
      # partial answer is the thing this probe exists to avoid.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: cargo test, shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          heavy1=run_corpus
          heavy2="fault_snapshots explore_corpus"
          case "${{ matrix.shard }}" in
            1)
              echo "shard 1: --test $heavy1"
              cargo test --test "$heavy1"
              ;;
            2)
              args=()
              for n in $heavy2; do args+=(--test "$n"); done
              echo "shard 2: ${args[*]}"
              cargo test "${args[@]}"
              ;;
            3)
              # The complement, by name: the lib and bin unit tests plus every
              # integration target not named above. Listed explicitly in the
              # log so the shard's membership is readable from the run itself.
              args=(--lib --bins)
              for f in tests/*.rs; do
                n=$(basename "$f" .rs)
                case " $heavy1 $heavy2 " in
                  *" $n "*) continue ;;
                esac
                args+=(--test "$n")
              done
              echo "shard 3 holds $(( (${#args[@]} - 2) / 2 )) integration targets plus --lib --bins"
              echo "shard 3: ${args[*]}"
              cargo test "${args[@]}"
              ;;
          esac
