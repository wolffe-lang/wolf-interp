[package]
name = "wolf-interp"
version = "0.1.25"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-or-later"
description = "The reference interpreter for the wolf language: an independent, executable reading of the specification, and the compiler's differential-testing oracle."
keywords = ["wolf", "interpreter", "reference-implementation", "differential-testing"]
categories = ["development-tools"]
repository = "https://github.com/wolffe-lang/wolf-interp"
readme = "README.md"
publish = false

[lib]
name = "wolf_interp"
path = "src/lib.rs"

# The package (and repository) stay `wolf-interp`; the binary a user runs
# is `lupin` (is12 — the user decree of 2026-08-10).
[[bin]]
name = "lupin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rustyline = { version = "18.0.1", default-features = false, features = ["custom-bindings"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1"

[lints.rust]
# The interpreter is a correctness artifact; there is no performance
# argument that buys `unsafe` here (see CONTRIBUTING.md).
unsafe_code = "forbid"

[target."cfg(unix)".dev-dependencies]
rexpect = "0.7"
