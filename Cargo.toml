[package]
name = "wolf-interp"
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "The wolf reference interpreter: an independent implementation of the wolf specification and the compiler's differential-testing oracle."
repository = "https://github.com/tenseleyFlow/wolf-interp"
publish = false

[lib]
name = "wolf_interp"
path = "src/lib.rs"

[[bin]]
name = "wolf-interp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1"

[lints.rust]
# The interpreter is a correctness artifact; there is no performance
# argument that buys `unsafe` here (see CONTRIBUTING.md).
unsafe_code = "forbid"
